<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMSD Common Music Assessments</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f3ec;
    --parchment: #ede7d9;
    --navy: #1a2744;
    --navy-mid: #2c3e6b;
    --gold: #c8973a;
    --gold-light: #e8b84b;
    --green: #2d7a5f;
    --text: #1a1a2e;
    --muted: #6b6b8a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--cream);
    background-image: repeating-linear-gradient(transparent, transparent 39px, #c8c0b0 39px, #c8c0b0 40px);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    padding: 20px;
  }

  .card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 4px 32px rgba(26,39,68,0.13);
    width: 100%;
    max-width: 540px;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    padding: 24px 28px 20px;
    color: white;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.3;
    color: white;
  }

  .header h1 span {
    display: block;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-light);
    margin-bottom: 4px;
    font-family: 'DM Sans', sans-serif;
  }

  .menu-body {
    padding: 28px;
  }

  .menu-intro {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .menu-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .folder-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .folder-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 12px;
    border: 2px solid;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    text-decoration: none;
  }

  .folder-card:hover { transform: translateY(-1px); }

  /* Pitch card */
  .pitch-card { background: #f0ecf8; border-color: #c9bce8; }
  .pitch-card:hover { background: #e6dff5; }
  .pitch-card .folder-icon { color: #6b4faa; }

  /* Rhythm card */
  .rhythm-card { background: #fdf4e3; border-color: #e8d099; }
  .rhythm-card:hover { background: #f5e8c8; }
  .rhythm-card .folder-icon { color: #a07820; }

  /* Staff Hero card — retro arcade style */
  .hero-card {
    background: #0d0d1a;
    border-color: #e8b84b;
    border-width: 2px;
    position: relative;
    overflow: hidden;
    padding: 16px 20px;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px, rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 4px
    );
    pointer-events: none;
  }
  .hero-card:hover { background: #141428; border-color: #f5c842; }
  .hero-card .folder-arrow { color: #e8b84b; }
  .hero-card:hover .folder-arrow { color: #f5c842; }

  .hero-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.82rem;
    color: #e8b84b;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    line-height: 1.4;
    text-shadow: 0 0 8px rgba(232,184,75,0.5);
  }

  .hero-desc {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.45rem;
    color: #5ecfef;
    letter-spacing: 0.08em;
    line-height: 1.8;
    text-shadow: 0 0 6px rgba(94,207,239,0.4);
  }

  .hero-icon {
    font-size: 1.8rem;
    flex-shrink: 0;
    width: 44px;
    text-align: center;
    filter: drop-shadow(0 0 6px rgba(232,184,75,0.6));
  }

  .folder-icon {
    font-size: 2rem;
    flex-shrink: 0;
    width: 44px;
    text-align: center;
  }

  .folder-info { flex: 1; }

  .folder-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--navy);
    margin-bottom: 2px;
  }

  .folder-desc { font-size: 0.78rem; color: var(--muted); }

  .folder-arrow {
    color: var(--muted);
    font-size: 1.4rem;
    margin-left: auto;
    flex-shrink: 0;
  }

  .folder-card:hover .folder-arrow { color: var(--navy); }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>
      <span>LMSD Music</span>
      🎼 Common Music Assessments
    </h1>
  </div>
  <div class="menu-body">
    <div class="menu-intro">Choose an Assessment Area</div>
    <div class="menu-sub">Select an area to get started.</div>
    <div class="folder-cards">

      <div class="folder-card pitch-card" onclick="window.location.href='pitch.html'">
        <div class="folder-icon">🎵</div>
        <div class="folder-info">
          <div class="folder-title">Pitch</div>
          <div class="folder-desc">Note reading · Fingering · Orchestra, Band & Chorus</div>
        </div>
        <div class="folder-arrow">›</div>
      </div>

      <div class="folder-card rhythm-card" onclick="window.location.href='rhythm.html'">
        <div class="folder-icon">🥁</div>
        <div class="folder-info">
          <div class="folder-title">Rhythm</div>
          <div class="folder-desc">Rhythm reading · Pattern recognition</div>
        </div>
        <div class="folder-arrow">›</div>
      </div>

      <div class="folder-card hero-card" onclick="window.location.href='staffhero.html'">
        <div class="hero-icon">🎮</div>
        <div class="folder-info">
          <div class="hero-title">STAFF HERO</div>
          <div class="hero-desc">A NOTE READING ADVENTURE</div>
        </div>
        <div class="folder-arrow">›</div>
      </div>

    </div>
  </div>
</div>
<script>
  // Hash routing: #staffhero → redirect to staffhero.html
  (function() {
    var hash = window.location.hash.replace(/^#\/?/, '');
    if (hash === 'staffhero') window.location.href = 'staffhero.html';
    else if (hash.startsWith('pitch')) window.location.href = 'pitch.html' + window.location.hash;
    else if (hash.startsWith('rhythm')) window.location.href = 'rhythm.html' + window.location.hash;
  })();
</script>
</body>
</html>

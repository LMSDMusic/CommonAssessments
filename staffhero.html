<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Hero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }
  #gameCanvas {
    display: block;
    image-rendering: pixelated;
    border: 3px solid #444;
  }

  #canvasWrapper {
    position: relative;
    display: inline-block;
  }
  #submitPanel {
    display: none;
    position: absolute;
    bottom: -62px;
    left: 50%;
    transform: translateX(-50%);
    background: #0a0a1a;
    border: 2px solid #ffe066;
    padding: 10px 16px 12px;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #ffe066;
    white-space: nowrap;
  }
  #submitPanel.visible { display: flex; }
  #playerName {
    background: #111133;
    border: 2px solid #ffe066;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 6px 8px;
    width: 140px;
    outline: none;
  }
  #submitBtn {
    background: #1a1a3a;
    border: 2px solid #ffe066;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  #submitBtn:hover { background: #4466ee; }
  #submitBtn:disabled { opacity: 0.45; cursor: default; }
  #submitStatus { font-size: 8px; min-width: 60px; }
</style>
</head>
<body>
<div id="canvasWrapper">
  <canvas id="gameCanvas" tabindex="0"></canvas>
  <div id="submitPanel">
    <span>NAME:</span>
    <input id="playerName" type="text" maxlength="24" placeholder="Your name" autocomplete="off" />
    <button id="submitBtn">SUBMIT</button>
    <span id="submitStatus"></span>
  </div>
</div>

<script>
// ─── SCORE SUBMISSION ─────────────────────────────────────────────────────────
// Paste your Google Apps Script Web App URL here after deploying:
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyOUJ0oQtUgzlPRUsfSFMqykPgtuu_7KK-J27ewjzRaAZb3q64KfSBiMgDAusIp77kl/exec';

const submitPanel = document.getElementById('submitPanel');
const playerNameInput = document.getElementById('playerName');
const submitBtn = document.getElementById('submitBtn');
const submitStatus = document.getElementById('submitStatus');

function showSubmitPanel() {
  submitPanel.classList.add('visible');
  submitStatus.textContent = '';
  submitBtn.disabled = false;
  submitBtn.textContent = 'SUBMIT';
  playerNameInput.focus();
}

function hideSubmitPanel() {
  submitPanel.classList.remove('visible');
}

submitBtn.addEventListener('click', async () => {
  const name = playerNameInput.value.trim();
  if (!name) { submitStatus.style.color = '#ff4444'; submitStatus.textContent = 'Enter name!'; return; }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL_HERE') {
    submitStatus.style.color = '#ff4444'; submitStatus.textContent = 'No URL set'; return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = '...';
  submitStatus.style.color = '#aaddff';
  submitStatus.textContent = 'Sending...';
  try {
    const payload = {
      name,
      score,
      level: currentLevel,
      instrument: selectedInstrument,
    };
    const form = new URLSearchParams();
    form.append('name',       payload.name);
    form.append('score',      payload.score);
    form.append('level',      payload.level);
    form.append('instrument', payload.instrument);
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: form,
    });
    submitStatus.style.color = '#44ff88';
    submitStatus.textContent = 'Saved!';
    submitBtn.textContent = 'DONE';
  } catch (err) {
    submitStatus.style.color = '#ff4444';
    submitStatus.textContent = 'Error!';
    submitBtn.disabled = false;
    submitBtn.textContent = 'SUBMIT';
  }
});

// Allow Enter key in name field to trigger submit
playerNameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.stopPropagation(); submitBtn.click(); }
});

// ─── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 920, H = 520;
canvas.width = W;
canvas.height = H;

// ─── STAFF LAYOUT ─────────────────────────────────────────────────────────────
// Staff: 5 lines, each LINE_SPACING px apart.
// staffLines[0] = top line, staffLines[4] = bottom line.
//
// TREBLE CLEF lines bottom→top: E4, G4, B4, D5, F5
// ALTO CLEF   lines bottom→top: F3, A3, C4, E4, G4
//   Middle C (C4) sits on the MIDDLE line (staffLines[2])

const LINE_SPACING = 21;
const STAFF_TOP = 90;
const staffLines = [
  STAFF_TOP,
  STAFF_TOP + LINE_SPACING,
  STAFF_TOP + LINE_SPACING * 2,
  STAFF_TOP + LINE_SPACING * 3,
  STAFF_TOP + LINE_SPACING * 4,
];
const STAFF_BOTTOM = staffLines[4];

// ── Treble clef note Y positions ──────────────────────────────────────────────
// Lines (bottom→top): E4 G4 B4 D5 F5
// Spaces (bottom→top): F4 A4 C5 E5
const NOTE_Y_TREBLE = {
  'G3': STAFF_BOTTOM + LINE_SPACING * 2.5,      // space below 2nd ledger line below staff
  'A3': STAFF_BOTTOM + LINE_SPACING * 2.0,      // 2nd ledger line below staff
  'B3': STAFF_BOTTOM + LINE_SPACING * 1.5,      // space below 1st ledger line below staff
  'C4': STAFF_BOTTOM + LINE_SPACING * 1.0,      // 1st ledger line below staff
  'D4': STAFF_BOTTOM + LINE_SPACING / 2,        // space below bottom line
  'E4': STAFF_BOTTOM,                            // line 5 (bottom)
  'F4': STAFF_BOTTOM - LINE_SPACING / 2,        // first space
  'G4': STAFF_BOTTOM - LINE_SPACING,            // line 4
  'Ab4': STAFF_BOTTOM - LINE_SPACING * 1.5,     // 2nd space (Ab4 = same position as A4)
  'A4': STAFF_BOTTOM - LINE_SPACING * 1.5,      // 2nd space
  'Bb4': STAFF_BOTTOM - LINE_SPACING * 2,       // line 3 (same position as B4)
  'B4': STAFF_BOTTOM - LINE_SPACING * 2,        // line 3
  'C#5': STAFF_BOTTOM - LINE_SPACING * 2.5,     // 3rd space (C#5 for D major strings)
  'C5':  STAFF_BOTTOM - LINE_SPACING * 2.5,      // 3rd space (C natural for flute Bb major)
  'D5': STAFF_BOTTOM - LINE_SPACING * 3,        // line 2
  'Eb5': STAFF_BOTTOM - LINE_SPACING * 3.5,     // 2nd space from top
  'F5': STAFF_BOTTOM - LINE_SPACING * 4,        // top line
  'G5': STAFF_BOTTOM - LINE_SPACING * 4.5,      // space above top line
  'Ab5': STAFF_BOTTOM - LINE_SPACING * 5,       // 1st ledger line above
  'A5':  STAFF_BOTTOM - LINE_SPACING * 5,       // 1st ledger line above (same position as Ab5)
  'Bb5': STAFF_BOTTOM - LINE_SPACING * 5.5,     // space above 1st ledger
  'E5':  STAFF_BOTTOM - LINE_SPACING * 3.5,     // 4th space (between D5 and F5)
  'F#5': STAFF_BOTTOM - LINE_SPACING * 4,       // top line (same position as F5, sharp by key sig)
};

// ── Alto clef note Y positions ────────────────────────────────────────────────
// Lines (bottom→top): F3 A3 C4 E4 G4
// Spaces (bottom→top): G3 B3 D4 F4 (then above staff: A4 space, B4, C5, D5)
// Middle line (staffLines[2]) = C4. Each diatonic step = LINE_SPACING/2 upward.
const NOTE_Y_ALTO = {
  'C3': staffLines[4] + LINE_SPACING * 1.5,   // space below 1st ledger line below staff
  'D3': staffLines[4] + LINE_SPACING * 1.0,   // 1st ledger line below staff
  'E3': staffLines[4] + LINE_SPACING * 0.5,   // space below bottom line (F3)
  'F3': staffLines[4],                          // bottom line of alto staff (F3)
  'G3': staffLines[3] + LINE_SPACING * 0.5,   // space below A3 line (below staff)
  'A3': staffLines[3],                          // 2nd line from bottom (A3)
  'B3': staffLines[2] + LINE_SPACING * 0.5,    // space between A3 and C4 lines
  'C4': staffLines[2],                          // middle line (C4)
  'D4': staffLines[2] - LINE_SPACING * 0.5,   // 2nd space from bottom (D4)
  'E4': staffLines[2] - LINE_SPACING * 1.0,   // 4th line (E4)
  'F4': staffLines[2] - LINE_SPACING * 1.5,   // 4th space (F#4)
  'G4': staffLines[2] - LINE_SPACING * 2.0,   // top line (G4)
  'A4': staffLines[2] - LINE_SPACING * 2.5,   // space above top line
  'B4': staffLines[2] - LINE_SPACING * 3.0,   // first ledger line above
  'C#5': staffLines[2] - LINE_SPACING * 3.5,  // space above first ledger (C# for D major)
  'C5':  staffLines[2] - LINE_SPACING * 3.5,   // space above first ledger (C natural)
  'D5': staffLines[2] - LINE_SPACING * 4.0,   // second ledger line above
};

// ── Bass clef note Y positions ────────────────────────────────────────────────
// Lines (bottom→top): G2 B2 D3 F3 A3
// Spaces (bottom→top): A2 C3 E3 G3
// Middle line (staffLines[2]) = D3. Each diatonic step = LINE_SPACING/2 upward.
const NOTE_Y_BASS = {
  'C2': staffLines[4] + LINE_SPACING * 2.0,   // 2nd ledger line below bass staff
  'D2': staffLines[4] + LINE_SPACING * 1.5,   // space below 1st ledger line below
  'E2': staffLines[4] + LINE_SPACING * 1.0,   // 1st ledger line below bass staff
  'F2': staffLines[4] + LINE_SPACING * 0.5,   // space below G2 (bottom line)
  'F#2': staffLines[4] + LINE_SPACING * 0.5,  // same position as F2 (sharp by key sig)
  'G2': staffLines[4],                         // bottom line (G2)
  'A2': staffLines[4] - LINE_SPACING * 0.5,   // space above bottom line
  'B2': staffLines[3],                         // 2nd line from bottom (B2)
  'C3': staffLines[3] - LINE_SPACING * 0.5,   // space between B2 and D3
  'D3': staffLines[2],                         // middle line (3rd line)
  'E3': staffLines[2] - LINE_SPACING * 0.5,   // 3rd space
  'F3': staffLines[2] - LINE_SPACING * 1.0,   // 4th line (F#3)
  'G3': staffLines[2] - LINE_SPACING * 1.5,   // 4th space
  'A3': staffLines[2] - LINE_SPACING * 2.0,   // top line (A3)
  'B3': staffLines[2] - LINE_SPACING * 2.5,   // space above top line
  'C4': staffLines[2] - LINE_SPACING * 3.0,   // first ledger line above (C#4)
  'D4': staffLines[2] - LINE_SPACING * 3.5,   // space above first ledger
};

// Returns the correct Y map for the active instrument
function getNoteYMap() {
  if (selectedInstrument === 'Viola') return NOTE_Y_ALTO;
  if (selectedInstrument === 'Cello' || selectedInstrument === 'Bass') return NOTE_Y_BASS;
  return NOTE_Y_TREBLE;
}

// Convenience — Y for a single pitch given current instrument
function getNoteY(pitch) { return getNoteYMap()[pitch]; }

// ─── LEVEL DEFINITIONS ────────────────────────────────────────────────────────
const VIOLIN_LEVELS = {
  1: { pitches: ['D4','E4','F4'],                              tonic: 'D4', keySig: 'D',
       rows: [['D4','E4','F4']],
       rowLabels: ['D String'], title: 'D, E, F#' },
  2: { pitches: ['D4','E4','F4','G4','A4'],                    tonic: 'D4', keySig: 'D',
       rows: [['A4'], ['D4','E4','F4','G4']],
       rowLabels: ['A String', 'D String'], title: 'D String + A' },
  3: { pitches: ['D4','E4','F4','G4','A4','B4','C#5','D5'],    tonic: 'D4', keySig: 'D',
       rows: [['A4','B4','C#5','D5'], ['D4','E4','F4','G4']],
       rowLabels: ['A String', 'D String'], title: 'D & A Strings' },
  4: { pitches: ['G3','A3','B3','C4'],                         tonic: 'G3', keySig: 'G',
       rows: [['G3','A3','B3','C4']],
       rowLabels: ['G String'], title: 'G String' },
  5: { pitches: ['G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5'], tonic: 'G3', keySig: 'G',
       rows: [['A4','B4','C5','D5'], ['D4','E4','F4','G4'], ['G3','A3','B3','C4']],
       rowLabels: ['A String', 'D String', 'G String'], title: 'G, D, A Strings' },
  6: { pitches: ['E5','F#5','G5','A5'],                        tonic: 'E5', keySig: 'G',
       rows: [['E5','F#5','G5','A5']],
       rowLabels: ['E String'], title: 'E String' },
  7: { pitches: ['G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F#5','G5','A5'],
       tonic: 'G3', keySig: 'G',
       rows: [['E5','F#5','G5','A5'], ['A4','B4','C5','D5'], ['D4','E4','F4','G4'], ['G3','A3','B3','C4']],
       rowLabels: ['E String', 'A String', 'D String', 'G String'], title: 'All Strings' },
};
const VIOLA_LEVELS = {
  1: { pitches: ['D4','E4','F4'],                              tonic: 'D4', keySig: 'D',
       rows: [['D4','E4','F4']],
       rowLabels: ['D String'], title: 'D, E, F#' },
  2: { pitches: ['D4','E4','F4','G4','A4'],                    tonic: 'D4', keySig: 'D',
       rows: [['A4'], ['D4','E4','F4','G4']],
       rowLabels: ['A String', 'D String'], title: 'D String + A' },
  3: { pitches: ['D4','E4','F4','G4','A4','B4','C#5','D5'],    tonic: 'D4', keySig: 'D',
       rows: [['A4','B4','C#5','D5'], ['D4','E4','F4','G4']],
       rowLabels: ['A String', 'D String'], title: 'D & A Strings' },
  4: { pitches: ['G3','A3','B3','C4'],                         tonic: 'G3', keySig: 'G',
       rows: [['G3','A3','B3','C4']],
       rowLabels: ['G String'], title: 'G String' },
  5: { pitches: ['G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5'], tonic: 'G3', keySig: 'G',
       rows: [['A4','B4','C5','D5'], ['D4','E4','F4','G4'], ['G3','A3','B3','C4']],
       rowLabels: ['A String', 'D String', 'G String'], title: 'G, D, A Strings' },
  6: { pitches: ['C3','D3','E3','F3'],                         tonic: 'C3', keySig: 'C',
       rows: [['C3','D3','E3','F3']],
       rowLabels: ['C String'], title: 'C String' },
  7: { pitches: ['C3','D3','E3','F3','G3','A3','B3','C4','D4','E4','F4','G4','A4','B4','C5','D5'],
       tonic: 'C3', keySig: 'C',
       rows: [['A4','B4','C5','D5'], ['D4','E4','F4','G4'], ['G3','A3','B3','C4'], ['C3','D3','E3','F3']],
       rowLabels: ['A String', 'D String', 'G String', 'C String'], title: 'All Strings' },
};
// Keep LEVELS as alias for any legacy references
const LEVELS = VIOLIN_LEVELS;

const CELLO_LEVELS = {
  1: { pitches: ['D3','E3','F3'],                           tonic: 'D3', keySig: 'D',
       rows: [['D3','E3','F3']],
       rowLabels: ['D String'], title: 'D, E, F#' },
  2: { pitches: ['D3','E3','F3','G3','A3'],                 tonic: 'D3', keySig: 'D',
       rows: [['A3'], ['D3','E3','F3','G3']],
       rowLabels: ['A String', 'D String'], title: 'D String + A' },
  3: { pitches: ['D3','E3','F3','G3','A3','B3','C4','D4'],  tonic: 'D3', keySig: 'D',
       rows: [['A3','B3','C4','D4'], ['D3','E3','F3','G3']],
       rowLabels: ['A String', 'D String'], title: 'D & A Strings' },
  4: { pitches: ['G2','A2','B2','C3'],                      tonic: 'G2', keySig: 'G',
       rows: [['G2','A2','B2','C3']],
       rowLabels: ['G String'], title: 'G String' },
  5: { pitches: ['G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4','D4'], tonic: 'G2', keySig: 'G',
       rows: [['A3','B3','C4','D4'], ['D3','E3','F3','G3'], ['G2','A2','B2','C3']],
       rowLabels: ['A String', 'D String', 'G String'], title: 'G, D, A Strings' },
  6: { pitches: ['C2','D2','E2','F2'],                      tonic: 'C2', keySig: 'C',
       rows: [['C2','D2','E2','F2']],
       rowLabels: ['C String'], title: 'C String' },
  7: { pitches: ['C2','D2','E2','F2','G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4','D4'],
       tonic: 'C2', keySig: 'C',
       rows: [['A3','B3','C4','D4'], ['D3','E3','F3','G3'], ['G2','A2','B2','C3'], ['C2','D2','E2','F2']],
       rowLabels: ['A String', 'D String', 'G String', 'C String'], title: 'All Strings' },
};
const BASS_LEVELS = {
  // Bass tuned E-A-D-G (low→high). Rows top→bottom: G string, D string, A string, E string.
  1: { pitches: ['D3','E3','F3'],                           tonic: 'D3', keySig: 'D',
       rows: [['D3','E3','F3']],
       rowLabels: ['D String'], title: 'D, E, F#' },
  2: { pitches: ['D3','E3','F3','G3','A3'],                 tonic: 'D3', keySig: 'D',
       rows: [['G3','A3'], ['D3','E3','F3']],
       rowLabels: ['G String', 'D String'], title: 'D String + A' },
  3: { pitches: ['D3','E3','F3','G3','A3','B3','C4','D4'],  tonic: 'D3', keySig: 'D',
       rows: [['G3','A3','B3','C4','D4'], ['D3','E3','F3']],
       rowLabels: ['G String', 'D String'], title: 'D & G Strings' },
  4: { pitches: ['G2','A2','B2','C3'],                      tonic: 'G2', keySig: 'G',
       rows: [['G2','A2','B2','C3']],
       rowLabels: ['G String'], title: 'A String + G' },
  5: { pitches: ['A2','B2','C3','E3','F3','G3','A3','B3','C4','D4'], tonic: 'G3', keySig: 'G',
       rows: [['G3','A3','B3','C4','D4'], ['E3','F3','G3'], ['A2','B2','C3']],
       rowLabels: ['G String', 'D String', 'A String'], title: 'G, D, A Strings + G' },
  6: { pitches: ['G2','F#2','E2'],                          tonic: 'G2', keySig: 'G',
       rows: [['E2','F#2','G2']],
       rowLabels: ['E String'], title: 'E String' },
  7: { pitches: ['E2','F#2','G2','A2','B2','C3','D3','E3','F3','G3','A3','B3','C4','D4'],
       tonic: 'D3', keySig: 'D',
       rows: [['G3','A3','B3','C4','D4'], ['D3','E3','F3'], ['A2','B2','C3'], ['E2','F#2','G2']],
       rowLabels: ['G String', 'D String', 'A String', 'E String'], title: 'All Strings' },
};
// Display names (accidentals implied by D Major key signature)
// Pitch display — keySig-aware so C4 shows as C in G major and C# in D major
const PITCH_DISPLAY_D = {
  G2:'G', A2:'A', B2:'B', C3:'C', 'F#2':'F#',
  D3:'D', E3:'E', F3:'F#', G3:'G', A3:'A', B3:'B', C4:'C#', D4:'D',
  E4:'E', F4:'F#', G4:'G', A4:'A', B4:'B', 'C#5':'C#', D5:'D',
};
const PITCH_DISPLAY_G = {
  G2:'G', A2:'A', B2:'B', C3:'C', 'F#2':'F#',
  D3:'D', E3:'E', F3:'F#', G3:'G', A3:'A', B3:'B', C4:'C',
  D4:'D', E4:'E', F4:'F#', G4:'G', A4:'A', B4:'B', C5:'C', 'C#5':'C', D5:'D',
  E5:'E', 'F#5':'F#', G5:'G', A5:'A',
};
const PITCH_DISPLAY_Bb = {
  Ab4:'Ab', Bb4:'Bb', C5:'C', D5:'D', Eb5:'Eb', F5:'F', G5:'G', Ab5:'Ab', Bb5:'Bb',
};
const PITCH_DISPLAY_C = {
  C2:'C', D2:'D', E2:'E', F2:'F',
  C3:'C', D3:'D', E3:'E', F3:'F', G3:'G', A3:'A', B3:'B',
  C4:'C', D4:'D', E4:'E', F4:'F', G4:'G', A4:'A', B4:'B',
  C5:'C', D5:'D', E5:'E', F5:'F', G5:'G', A5:'A', B5:'B',
};
function getLevelSet() {
  if (selectedInstrument === 'Cello') return CELLO_LEVELS;
  if (selectedInstrument === 'Bass')  return BASS_LEVELS;
  if (selectedInstrument === 'Viola') return VIOLA_LEVELS;
  return VIOLIN_LEVELS;
}
function getPitchDisplay(pitch) {
  const levelDef = getLevelSet()[currentLevel];
  const keySig = levelDef && levelDef.keySig;
  if (keySig === 'Bb') return PITCH_DISPLAY_Bb[pitch] || pitch[0];
  if (keySig === 'G')  return PITCH_DISPLAY_G[pitch]  || PITCH_DISPLAY_C[pitch] || pitch[0];
  if (keySig === 'C')  return PITCH_DISPLAY_C[pitch]  || pitch[0];
  return PITCH_DISPLAY_D[pitch] || pitch[0];
}
// Keep PITCH_DISPLAY as alias for backwards compat in non-dynamic contexts
const PITCH_DISPLAY = PITCH_DISPLAY_D;
// Which pitches get an extra gap AFTER them in the button row (visual grouping)
const EXTRA_GAP_AFTER = new Set(['G4', 'G3', 'G2', 'G5']); // gap between G and A (all octaves)

// ─── AUDIO ────────────────────────────────────────────────────────────────────
// Frequencies for D4, E4, F#4 etc. (violin/viola) and D3, E3, F#3 etc. (cello)
const NOTE_FREQ = {
  'D4': 293.66, 'E4': 329.63, 'F4': 369.99,
  'G4': 392.00, 'Ab4': 415.30, 'A4': 440.00, 'Bb4': 466.16, 'B4': 493.88,
  'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'Eb5': 622.25, 'F5': 698.46,
  'G5': 783.99, 'Ab5': 830.61, 'Bb5': 932.33,
  // Cello/Bass level 1-3 and Violin/Viola level 4
  'D3': 146.83, 'E3': 164.81, 'F3': 185.00,
  'G3': 196.00, 'A3': 220.00, 'B3': 246.94,
  'C4': 261.63,
  // Cello/Bass level 4 — one octave below violin level 4
  'G2':  98.00, 'A2': 110.00, 'B2': 123.47, 'C3': 130.81,
  // Level 6 additions
  'E5': 659.25, 'F#5': 739.99, 'A5': 880.00,   // Violin level 6

};

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playNoteSound(pitch, big = false) {
  const freq = NOTE_FREQ[pitch];
  if (!freq) return;
  const ac = getAudioCtx();

  // Primary sawtooth — the note's actual pitch
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, ac.currentTime);
  gain.gain.setValueAtTime(0, ac.currentTime);
  gain.gain.linearRampToValueAtTime(big ? 0.32 : 0.28, ac.currentTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + (big ? 0.38 : 0.22));
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(ac.currentTime);
  osc.stop(ac.currentTime + 0.4);

  // On a big hit: add the same pitch one octave down
  if (big) {
    const osc2 = ac.createOscillator();
    const gain2 = ac.createGain();
    osc2.type = 'sawtooth';
    osc2.frequency.setValueAtTime(freq / 2, ac.currentTime);
    gain2.gain.setValueAtTime(0, ac.currentTime);
    gain2.gain.linearRampToValueAtTime(0.22, ac.currentTime + 0.015);
    gain2.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.45);
    osc2.connect(gain2);
    gain2.connect(ac.destination);
    osc2.start(ac.currentTime);
    osc2.stop(ac.currentTime + 0.5);
  }
}

// ─── BACKING TRACK ────────────────────────────────────────────────────────────
// Pattern: tonic-fifth-tonic'-fifth looping as eighth notes at 84 BPM
const BPM            = 84;
const EIGHTH_DUR     = 60 / BPM / 2;          // ~0.357s per eighth note
const LOOKAHEAD_MS   = 25.0;
const SCHEDULE_AHEAD = 0.1;

// Backing patterns per key signature: [tonic, fifth, tonic-octave-up, fifth]
const BACKING_PATTERNS = {
  'D':  [293.66, 440.00, 587.33, 440.00], // D4, A4, D5, A4
  'G':  [196.00, 293.66, 392.00, 293.66], // G3, D4, G4, D4
  'Bb': [233.08, 349.23, 466.16, 349.23], // Bb3, F4, Bb4, F4
  'C':  [261.63, 392.00, 523.25, 392.00], // C4, G4, C5, G4
};

function getBackingFreqs() {
  const levelDef = getLevelSet()[currentLevel];
  const keySig = levelDef ? levelDef.keySig : 'D';
  return BACKING_PATTERNS[keySig] || BACKING_PATTERNS['D'];
}

let backingActive    = false;
let backingNoteIdx   = 0;
let nextNoteTime     = 0;
let backingInterval  = null;
let currentBackingFreqs = BACKING_PATTERNS['D'];
let floatingLabels = []; // Array to hold {x, y, text, color, vx, vy, life}	

function scheduleBackingNote(freq, time) {
  const ac = getAudioCtx();

  const osc  = ac.createOscillator();
  const gain = ac.createGain();
  // Sine wave — warm, unobtrusive underneath the player's sawtooth zaps
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, time);

  const noteDur = EIGHTH_DUR * 0.75; // slight staccato so notes separate
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.10, time + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + noteDur);

  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(time);
  osc.stop(time + noteDur + 0.01);
}

function backingScheduler() {
  const ac = getAudioCtx();
  while (nextNoteTime < ac.currentTime + SCHEDULE_AHEAD) {
    scheduleBackingNote(currentBackingFreqs[backingNoteIdx % currentBackingFreqs.length], nextNoteTime);
    backingNoteIdx++;
    nextNoteTime += EIGHTH_DUR;
  }
}

function startBackingTrack() {
  if (backingActive) return;
  backingActive  = true;
  backingNoteIdx = 0;
  currentBackingFreqs = getBackingFreqs();
  nextNoteTime   = getAudioCtx().currentTime + 0.02;
  backingInterval = setInterval(backingScheduler, LOOKAHEAD_MS);
}

function stopBackingTrack() {
  backingActive = false;
  if (backingInterval) { clearInterval(backingInterval); backingInterval = null; }
  // Close and null the AudioContext — kills all queued scheduled nodes immediately.
  // getAudioCtx() will create a fresh one next time it's needed.
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
}

function isOnBeat() {
  if (!backingActive) return false;
  const ac = getAudioCtx();
  const now = ac.currentTime;
  // How far into the current eighth-note interval are we?
  // nextNoteTime is always the NEXT scheduled note, so the last beat was nextNoteTime - EIGHTH_DUR
  const lastBeat = nextNoteTime - EIGHTH_DUR;
  const phase = now - lastBeat;               // 0 = right on the beat, EIGHTH_DUR = next beat
  // Distance to nearest beat (could be the last or the upcoming one)
  const distToNearest = Math.min(phase, EIGHTH_DUR - phase);
  const tolerance = EIGHTH_DUR * 0.12;        // ±12% of an eighth note = tighter window for bonus
  return distToNearest < tolerance;
}


const NOTE_SPACING = 104; // horizontal pixels between notes
const CLEF_WIDTH = 138;  // space reserved for clef + key sig
const LEVEL_LENGTH = 25;

function generateLevel() {
  const levelSet = getLevelSet();
  const levelDef = levelSet[currentLevel];
  const pitches = levelDef.pitches;
  const tonic = levelDef.tonic;
  const notes = [];
  let lastPitch = null;
  for (let i = 0; i < LEVEL_LENGTH; i++) {
    let pitch;
    if (i === LEVEL_LENGTH - 1) {
      // Last note must be the tonic
      pitch = lastPitch === tonic
        ? pitches.filter(p => p !== tonic)[Math.floor(Math.random() * (pitches.length - 1))]
        : tonic;
    } else if (i === LEVEL_LENGTH - 2) {
      // Second-to-last must not be the tonic
      const available = pitches.filter(p => p !== lastPitch && p !== tonic);
      pitch = available[Math.floor(Math.random() * available.length)];
    } else {
      const available = pitches.filter(p => p !== lastPitch);
      pitch = available[Math.floor(Math.random() * available.length)];
    }
    lastPitch = pitch;
    notes.push({
      pitch,
      name: pitch[0],   // first letter: D, E, F, G, A
      x: CLEF_WIDTH + 70 + i * NOTE_SPACING,
      y: getNoteY(pitch),
      answered: false,
    });
  }
  return notes;
}

const PX = 2;

// Color palette
const C = {

const SPRITE_IDLE = [

  '___HWH_HWH_HWH__', // Row 01: Three Turret Tops
  '___HHHHHHHHHHH__', // Row 02: Top bridge (connecting the turrets)

  '_HHHHHHHHHHH____', // Row 10: Base flare starts, angled
  '_HWWWWWWWWWH____', // Row 11: Base highlight

  'WWWWWWWWWH______', // Row 13: Ground effect/thrust hint

  '________________', // Row 15: Clear air
];

const colorMap = { S:'skin', H:'hair', B:'shirt', P:'pants', K:'shoe', E:'eye', W:'white', M:'mouth', _:null };

function drawSprite(sprite, cx, cy, flipX = false) {
  const cols = sprite[0].length;
  const rows = sprite.length;
  const drawW = cols * PX;
  const drawH = rows * PX;
  ctx.save();
  if (flipX) {
    ctx.translate(cx + drawW / 2, cy);
    ctx.scale(-1, 1);
    ctx.translate(-drawW / 2, 0);
  } else {
    ctx.translate(cx, cy);
  }
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const ch = sprite[row][col];
      const key = colorMap[ch];
      if (!key) continue;
      ctx.fillStyle = C[key];
      ctx.fillRect(col * PX, row * PX, PX, PX);
    }
  }
  ctx.restore();
}

// ─── HEART DRAWING ────────────────────────────────────────────────────────────
function drawHeart(x, y, full, half) {
  const size = 10;
  ctx.save();
  ctx.translate(x, y);
  // outline
  ctx.fillStyle = '#440000';
  drawHeartShape(size + 1);
  if (full) {
    ctx.fillStyle = '#ff2222';
    drawHeartShape(size);
  } else if (half) {
    ctx.fillStyle = '#ff2222';
    ctx.beginPath();
    ctx.rect(0, -size / 2, size / 2 + 1, size * 1.2);
    ctx.clip();
    drawHeartShape(size);
  } else {
    ctx.fillStyle = '#333';
    drawHeartShape(size);
  }
  ctx.restore();
}

function drawHeartShape(size) {
  ctx.beginPath();
  ctx.moveTo(0, size * 0.3);
  ctx.bezierCurveTo(-size, -size * 0.3, -size, size * 0.8, 0, size);
  ctx.bezierCurveTo(size, size * 0.8, size, -size * 0.3, 0, size * 0.3);
  ctx.fill();
}

// ─── TREBLE CLEF DRAWING ──────────────────────────────────────────────────────
function drawTrebleClef(x) {
  ctx.save();
  ctx.fillStyle = '#ffe066';
  const clefHeight = LINE_SPACING * 7.5;
  ctx.font = `${clefHeight}px serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('𝄞', x, staffLines[3] + LINE_SPACING * 1.2);
  ctx.restore();
}

// ─── ALTO CLEF DRAWING ────────────────────────────────────────────────────────
// Unicode 𝄡 is the B clef — the notch must sit exactly on staffLines[2] (C4/middle line).
// The glyph's visual centre sits above its typographic middle, so we nudge down manually.
function drawAltoClef(x) {
  ctx.save();
  ctx.fillStyle = '#ffe066';
  const clefHeight = LINE_SPACING * 5.2;
  ctx.font = `${clefHeight}px serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  // Offset: push the glyph down so its visual notch aligns with the middle staff line.
  // The 𝄡 glyph centre sits roughly 18% above typographic middle — nudge down to compensate.
  const nudge = clefHeight * 0.09;
  ctx.fillText('𝄡', x, staffLines[2] + nudge);
  ctx.restore();
}

// ─── BASS CLEF DRAWING ────────────────────────────────────────────────────────
// Unicode 𝄢 — the two dots straddle the F3 line (staffLines[1] in bass clef).
// staffLines[1] = STAFF_TOP + LINE_SPACING = 2nd line from top = A3 line.
// We position the glyph so its F-dot notch aligns with staffLines[1].
function drawBassClef(x) {
  ctx.save();
  ctx.fillStyle = '#ffe066';
  const clefHeight = LINE_SPACING * 4.2 * 1.1576;
  ctx.font = `${clefHeight}px serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  // 𝄢 visual center sits roughly at the F line; nudge so it aligns with staffLines[1]
  ctx.fillText('𝄢', x, staffLines[1] + LINE_SPACING * 0.1 + 11);
  ctx.restore();
}

function drawClef(x) {
  if (selectedInstrument === 'Viola') drawAltoClef(x);
  else if (selectedInstrument === 'Cello' || selectedInstrument === 'Bass') drawBassClef(x);
  else drawTrebleClef(x);
}

// ─── KEY SIGNATURE ────────────────────────────────────────────────────────────
// D Major (levels 1-3): F# and C#. G Major (violin level 4): F# only. Bb Major (flute): Bb and Eb.
function drawKeySignature(x) {
  const levelDef = getLevelSet()[currentLevel];
  const keySig = levelDef ? levelDef.keySig : 'D';
  ctx.save();
  ctx.fillStyle = '#ffe066';
  ctx.font = `bold ${LINE_SPACING * 1.9}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  if (keySig === 'C') {
    // C major — no sharps or flats, draw nothing
  } else if (keySig === 'Bb') {
    // Treble clef Bb major: Bb on middle line (staffLines[2]), Eb on top space (staffLines[0]+LS*0.5)
    ctx.fillText('♭', x,      staffLines[2] + LINE_SPACING * 0.75); // Bb
    ctx.fillText('♭', x + 14, staffLines[0] + LINE_SPACING * 0.75); // Eb
  } else if (selectedInstrument === 'Viola') {
    ctx.fillText('♯', x,      staffLines[0] + LINE_SPACING * 0.9); // F#
    if (keySig !== 'G') ctx.fillText('♯', x + 14, staffLines[2] - LINE_SPACING * 0.1 + LINE_SPACING * 0.6); // C#
  } else if (selectedInstrument === 'Cello' || selectedInstrument === 'Bass') {
    // Bass clef: F# on 4th line (staffLines[1]), C# on middle line only for D major
    ctx.fillText('♯', x,      staffLines[1] + LINE_SPACING * 0.57); // F# always
    if (keySig !== 'G') ctx.fillText('♯', x + 15, staffLines[2] + LINE_SPACING * 0.9); // C# only D major
  } else {
    // Treble clef sharps
    ctx.fillText('♯', x,      staffLines[0] + LINE_SPACING * 0.4); // F#
    if (keySig !== 'G') ctx.fillText('♯', x + 14, staffLines[2] - LINE_SPACING * 0.6 + LINE_SPACING * 0.6); // C#
  }
  ctx.restore();
}

// ─── NOTE DRAWING ─────────────────────────────────────────────────────────────
function drawNote(note, camX) {
  const sx = note.x - camX;
  const sy = note.y;
  if (sx < -30 || sx > W + 30) return;

  // Ledger lines below staff for violin level 4 (G3, A3, B3, C4)
  if (selectedInstrument === 'Violin' || selectedInstrument === null || (!['Viola','Cello','Bass'].includes(selectedInstrument))) {
    const bottomLine = staffLines[4]; // E4 line
    const col = note.answered ? '#555' : '#ffe066';
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    // C4 sits ON the first ledger line below
    if (note.pitch === 'C4') {
      const ly = bottomLine + LINE_SPACING;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly); ctx.lineTo(sx + 13, ly); ctx.stroke();
    }
    // B3 sits in the space below the first ledger — ledger must still be shown
    if (note.pitch === 'B3') {
      const ly = bottomLine + LINE_SPACING;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly); ctx.lineTo(sx + 13, ly); ctx.stroke();
    }
    // A3 sits ON the second ledger line below — draw both ledgers
    if (note.pitch === 'A3') {
      const ly1 = bottomLine + LINE_SPACING;
      const ly2 = bottomLine + LINE_SPACING * 2;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly1); ctx.lineTo(sx + 13, ly1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 13, ly2); ctx.lineTo(sx + 13, ly2); ctx.stroke();
    }
    // G3 sits in the space below the second ledger — draw both ledgers
    if (note.pitch === 'G3') {
      const ly1 = bottomLine + LINE_SPACING;
      const ly2 = bottomLine + LINE_SPACING * 2;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly1); ctx.lineTo(sx + 13, ly1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 13, ly2); ctx.lineTo(sx + 13, ly2); ctx.stroke();
    }
  }

  // Ledger lines above the treble staff (flute: Ab5/Bb5; violin: A5)
  if (selectedInstrument === 'Violin') {
    const topLine = staffLines[0]; // F5 line
    const col = note.answered ? '#555' : '#ffe066';
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    const needsLedger1 = ['Ab5','Bb5','A5'].includes(note.pitch);
    if (needsLedger1) {
      const ly = topLine - LINE_SPACING;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly); ctx.lineTo(sx + 13, ly); ctx.stroke();
    }
  }

  // Ledger lines BELOW alto staff for viola level 6 (C3, D3 need ledger lines)
  if (selectedInstrument === 'Viola') {
    const altoBtm = staffLines[4]; // F3 bottom line
    const colA = note.answered ? '#555' : '#ffe066';
    ctx.strokeStyle = colA;
    ctx.lineWidth = 1.5;
    if (note.pitch === 'D3') { // 1st ledger below
      ctx.beginPath(); ctx.moveTo(sx - 13, altoBtm + LINE_SPACING); ctx.lineTo(sx + 13, altoBtm + LINE_SPACING); ctx.stroke();
    }
    if (note.pitch === 'C3') { // space below 1st ledger — still show ledger
      ctx.beginPath(); ctx.moveTo(sx - 13, altoBtm + LINE_SPACING); ctx.lineTo(sx + 13, altoBtm + LINE_SPACING); ctx.stroke();
    }
  }

  // Ledger lines for alto clef notes above the staff
  if (selectedInstrument === 'Viola') {
    const topLine = staffLines[0]; // G4 line
    const col = note.answered ? '#555' : '#ffe066';
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    // B4 sits ON the first ledger line above
    if (note.pitch === 'B4') {
      const ly = topLine - LINE_SPACING;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly); ctx.lineTo(sx + 13, ly); ctx.stroke();
    }
    // C#5/C5 sits in the space ABOVE the first ledger — ledger must still be shown
    if (note.pitch === 'C#5' || note.pitch === 'C5') {
      const ly = topLine - LINE_SPACING;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly); ctx.lineTo(sx + 13, ly); ctx.stroke();
    }
    // D5 sits ON the second ledger line — draw both ledgers
    if (note.pitch === 'D5') {
      const ly1 = topLine - LINE_SPACING;
      const ly2 = topLine - LINE_SPACING * 2;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly1); ctx.lineTo(sx + 13, ly1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 13, ly2); ctx.lineTo(sx + 13, ly2); ctx.stroke();
    }
  }

  // Ledger lines BELOW bass staff for cello level 6 (C2, D2, E2) and bass level 6 (E2)
  if (selectedInstrument === 'Cello' || selectedInstrument === 'Bass') {
    const bassBtm = staffLines[4]; // G2 bottom line
    const colB = note.answered ? '#555' : '#ffe066';
    ctx.strokeStyle = colB;
    ctx.lineWidth = 1.5;
    if (note.pitch === 'E2') {
      ctx.beginPath(); ctx.moveTo(sx - 13, bassBtm + LINE_SPACING); ctx.lineTo(sx + 13, bassBtm + LINE_SPACING); ctx.stroke();
    }
    if (note.pitch === 'D2') {
      ctx.beginPath(); ctx.moveTo(sx - 13, bassBtm + LINE_SPACING); ctx.lineTo(sx + 13, bassBtm + LINE_SPACING); ctx.stroke();
    }
    if (note.pitch === 'C2') {
      ctx.beginPath(); ctx.moveTo(sx - 13, bassBtm + LINE_SPACING); ctx.lineTo(sx + 13, bassBtm + LINE_SPACING); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - 13, bassBtm + LINE_SPACING * 2); ctx.lineTo(sx + 13, bassBtm + LINE_SPACING * 2); ctx.stroke();
    }
  }

  // Ledger lines for bass clef notes above the staff
  if (selectedInstrument === 'Cello' || selectedInstrument === 'Bass') {
    const topLine = staffLines[0]; // A3 top line of bass staff
    const col = note.answered ? '#555' : '#ffe066';
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    // C4 (C#) sits ON the first ledger line above
    if (note.pitch === 'C4') {
      const ly = topLine - LINE_SPACING;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly); ctx.lineTo(sx + 13, ly); ctx.stroke();
    }
    // D4 sits in the space above the first ledger — ledger still shown
    if (note.pitch === 'D4') {
      const ly = topLine - LINE_SPACING;
      ctx.beginPath(); ctx.moveTo(sx - 13, ly); ctx.lineTo(sx + 13, ly); ctx.stroke();
    }
  }

  // Solid notehead (oval)
  ctx.save();
  ctx.fillStyle = note.answered ? '#555' : '#ffe066';
  ctx.strokeStyle = note.answered ? '#333' : '#cc9900';
  ctx.lineWidth = 1;
  ctx.translate(sx, sy);
  ctx.rotate(-0.3);
  ctx.beginPath();
  ctx.ellipse(0, 0, 11, 7.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ─── STAFF DRAWING ────────────────────────────────────────────────────────────
function drawStaff(camX) {
  // Staff ends at the double bar line — no line past it
  const barSx = Math.max(20, DOUBLE_BAR_X - camX); // pinned position (same as drawDoubleBarLine)
  const staffEnd = barSx + 10; // a few px past the thin bar so it meets cleanly
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(0, staffLines[i]);
    ctx.lineTo(staffEnd, staffLines[i]);
    ctx.stroke();
  }
}

  const heartStartX = W - 20;
  const totalHearts = 3;
  for (let i = 0; i < totalHearts; i++) {
    const hx = heartStartX - i * 26;
    const halfHeartsForThis = hearts - (totalHearts - 1 - i) * 2;
    const full = halfHeartsForThis >= 2;
    const half = halfHeartsForThis === 1;

}

// ─── NOTE BUTTONS ─────────────────────────────────────────────────────────────
let noteBtns = []; // circle hit-test objects {pitch, name, cx, cy, r}

function hitTestCircle(pos, btn) {
  const dx = pos.x - btn.cx;
  const dy = pos.y - btn.cy;
  return dx * dx + dy * dy <= btn.r * btn.r;
}

// Half steps by key signature — key-aware to avoid E-F# being treated as E-F
// D major:  C#→D only
// G major:  B→C, F#→G
// C major:  E→F, B→C
const HALF_STEPS_BY_KEY = {
  'D': new Set([
    'C#5-D5','D5-C#5',
    'C4-D4','D4-C4',
    'C4-D3','D3-C4',
    'F4-G4','G4-F4',   // F#→G is a half step in D major too
    'F3-G3','G3-F3',
  ]),
  'G': new Set([
    'B4-C5','C5-B4',
    'B3-C4','C4-B3',
    'B3-C3','C3-B3',
    'B2-C3','C3-B2',
    'F4-G4','G4-F4',
    'F3-G3','G3-F3',
    'F2-G2','G2-F2',
    'F#5-G5','G5-F#5',
  ]),
  'C': new Set([
    'E4-F4','F4-E4',
    'E3-F3','F3-E3',
    'E2-F2','F2-E2',
    'B4-C5','C5-B4',
    'B3-C4','C4-B3',
    'B3-C3','C3-B3',
    'B2-C3','C3-B2',
    'B2-C2','C2-B2',
  ]),
  'Bb': new Set([
    // Bb major: E→F (Eb→F is whole), B→C (Bb→C is whole)
    // actual half steps: Bb→C is whole, Eb→F is whole, no standard half steps in this range
  ]),
};

function isHalfStep(pitchA, pitchB) {
  const levelDef = getLevelSet()[currentLevel];
  const keySig = levelDef ? levelDef.keySig : 'D';
  const pairs = HALF_STEPS_BY_KEY[keySig];
  return pairs ? pairs.has(pitchA + '-' + pitchB) : false;
}

// Compute x positions for a row given variable spacing
function rowXPositions(rowPitches, r, halfGap, wholeGap) {
  const positions = [0];
  for (let i = 1; i < rowPitches.length; i++) {
    const gap = isHalfStep(rowPitches[i-1], rowPitches[i]) ? halfGap : wholeGap;
    positions.push(positions[i-1] + r * 2 + gap);
  }
  return positions;
}

function drawNoteButtons() {
  const levelSet = getLevelSet();
  const levelDef = levelSet[currentLevel];
  const rows = levelDef.rows || [levelDef.pitches];

  const r = 25;
  const halfGap = 6;   // gap between half-step circles
  const wholeGap = 20; // gap between whole-step circles (double)
  const rowH = r * 2 + 12;
  const totalRows = rows.length;

  const bottomPad = 16;
  const gridH = (totalRows - 1) * rowH + r * 2;
  const gridTop = H - bottomPad - gridH;

  noteBtns = [];

  const rowLabels = levelDef.rowLabels || [];

  // Calculate x positions for each row
  const rowPositions = rows.map(rp => rowXPositions(rp, r, halfGap, wholeGap));

  // Widest row total span (last x position of each row)
  const maxRowW = Math.max(...rowPositions.map(pos => pos[pos.length - 1] || 0));

  // Left-align: anchor all rows so first circle aligns left
  const nutX = (W - maxRowW) / 2;
  const startX = nutX;

  // Nut: vertical line connecting top and bottom string lines
  const topStringY    = gridTop + r;
  const bottomStringY = gridTop + r + (totalRows - 1) * rowH;
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(startX - r - 6, topStringY);
  ctx.lineTo(startX - r - 6, bottomStringY);
  ctx.stroke();

  rows.forEach((rowPitches, rowIdx) => {
    const cy = gridTop + r + rowIdx * rowH;
    const xPos = rowPositions[rowIdx];

    // String line — from nut to end of this row's last circle
    const lineLeft  = startX - r - 6;
    const lineRight = startX + (xPos[xPos.length - 1] || 0) + r + 6;
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(lineLeft, cy);
    ctx.lineTo(lineRight, cy);
    ctx.stroke();

    // Row label to the left of the nut
    if (rowLabels[rowIdx]) {
      ctx.fillStyle = '#aaddff';
      ctx.font = '8px "Press Start 2P"';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(rowLabels[rowIdx], lineLeft - 8, cy);
    }

    // Circles
    rowPitches.forEach((pitch, colIdx) => {
      const cx = startX + xPos[colIdx];
      const label = getPitchDisplay(pitch);
      const hovered = hoveredBtn === `NOTE_${pitch}`;

      // Shadow
      ctx.beginPath();
      ctx.arc(cx + 2, cy + 2, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fill();

      // Body
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = hovered ? '#4466ee' : '#1a1a3a';
      ctx.fill();

      // Border
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Label
      ctx.fillStyle = '#fff';
      ctx.font = '11px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, cx, cy);

      noteBtns.push({ pitch, name: pitch[0], cx, cy, r });
    });
  });
}

// ─── DOUBLE BAR LINE ──────────────────────────────────────────────────────────
function drawDoubleBarLine(camX) {
  // Pin to left edge once the bar scrolls into view — never let it go further left than x=20
  const sx = Math.max(20, DOUBLE_BAR_X - camX);
  if (DOUBLE_BAR_X - camX > W + 10) return; // not yet visible
  ctx.save();
  ctx.strokeStyle = '#ffe066';
  // Thin bar
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx, staffLines[0]);
  ctx.lineTo(sx, staffLines[4]);
  ctx.stroke();
  // Thick bar
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(sx + 7, staffLines[0]);
  ctx.lineTo(sx + 7, staffLines[4]);
  ctx.stroke();
  ctx.restore();
}

// ─── PARTICLE SYSTEM ──────────────────────────────────────────────────────────
// Each particle: { x, y, vx, vy, life, maxLife, size, color }
let particles = [];

const PARTICLE_COLORS = [
  '#ffe066', '#ffcc00', '#ffffff', '#cc99ff', '#9933ff', '#bb66ff', '#fff4cc'
];

function spawnExplosion(worldX, worldY, big = false) {
  const count = big ? 42 : 22;
  const speedMult = big ? 1.6 : 1.0;
  const sizeMult  = big ? 1.8 : 1.0;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
    const speed = (60 + Math.random() * 120) * speedMult;
    const life   = (big ? 0.55 : 0.45) + Math.random() * 0.3;
    particles.push({
      x:       worldX,
      y:       worldY,
      vx:      Math.cos(angle) * speed,
      vy:      Math.sin(angle) * speed - (big ? 50 : 30),
      life,
      maxLife: life,
      size:    (2 + Math.floor(Math.random() * 3) * 2) * sizeMult,
      color:   PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)],
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x    += p.vx * dt;
    p.y    += p.vy * dt;
    p.vy   += 220 * dt;   // gravity
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles(camX) {
  for (const p of particles) {
    const sx = p.x - camX;
    if (sx < -20 || sx > W + 20) continue;
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(sx - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.restore();
  }
}
function updateAndDrawLabels(dt, camX) {
  for (let i = floatingLabels.length - 1; i >= 0; i--) {
    const l = floatingLabels[i];
    // Move label
    l.x += l.vx * dt;
    l.y += l.vy * dt;
    l.vy += 400 * dt; // Gravity pulls it down
    l.life -= dt;

    if (l.life <= 0) {
      floatingLabels.splice(i, 1);
      continue;
    }

    // Draw label
    ctx.save();
    ctx.globalAlpha = Math.min(1, l.life * 2);
    ctx.fillStyle = l.color;
    ctx.font = 'bold 12px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(l.text, l.x - camX, l.y);
    ctx.restore();
  }
}
	
// ─── NES BUTTON HELPER ────────────────────────────────────────────────────────
function drawNesButton(label, x, y, w, h, hovered, selected) {
  ctx.save();
  // Shadow
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 3, y + 3, w, h);
  // Body
  ctx.fillStyle = selected ? '#ffe066' : hovered ? '#4466ee' : '#1a1a3a';
  ctx.fillRect(x, y, w, h);
  // Border
  ctx.strokeStyle = selected ? '#fff' : '#ffe066';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  // Label
  ctx.fillStyle = selected ? '#000' : '#fff';
  ctx.font = '9px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2);
  ctx.restore();
}

// Draws staff + clef + key sig + lowest & highest noteheads joined by a line.
function drawMiniStaff(instrument, levelDef, staffCX, staffMidY, LS) {
  if (!levelDef) return;
  const pitches = levelDef.pitches;
  const keySig  = levelDef.keySig || 'D';

  const psl = [
    staffMidY - LS * 2,
    staffMidY - LS,
    staffMidY,
    staffMidY + LS,
    staffMidY + LS * 2,
  ];

  const pNoteY_treble = {
    'G3': psl[4]+LS*2.5, 'A3': psl[4]+LS*2, 'B3': psl[4]+LS*1.5,
    'C4': psl[4]+LS, 'D4': psl[4]+LS*.5, 'E4': psl[4],
    'F4': psl[4]-LS*.5, 'G4': psl[4]-LS, 'Ab4': psl[4]-LS*1.5,
    'A4': psl[4]-LS*1.5, 'Bb4': psl[4]-LS*2, 'B4': psl[4]-LS*2,
    'C#5': psl[4]-LS*2.5, 'C5': psl[4]-LS*2.5, 'D5': psl[4]-LS*3,
    'Eb5': psl[4]-LS*3.5, 'E5': psl[4]-LS*3.5,
    'F5': psl[4]-LS*4, 'F#5': psl[4]-LS*4,
    'G5': psl[4]-LS*4.5, 'Ab5': psl[4]-LS*5, 'A5': psl[4]-LS*5,
    'Bb5': psl[4]-LS*5.5,
  };
  const pNoteY_alto = {
    'C3': psl[4]+LS*1.5, 'D3': psl[4]+LS, 'E3': psl[4]+LS*.5, 'F3': psl[4],
    'G3': psl[3]+LS*.5, 'A3': psl[3], 'B3': psl[2]+LS*.5, 'C4': psl[2],
    'D4': psl[2]-LS*.5, 'E4': psl[2]-LS, 'F4': psl[2]-LS*1.5,
    'G4': psl[2]-LS*2, 'A4': psl[2]-LS*2.5, 'B4': psl[2]-LS*3,
    'C#5': psl[2]-LS*3.5, 'C5': psl[2]-LS*3.5, 'D5': psl[2]-LS*4,
  };
  const pNoteY_bass = {
    'C2': psl[4]+LS*2, 'D2': psl[4]+LS*1.5, 'E2': psl[4]+LS, 'F2': psl[4]+LS*.5,
    'F#2': psl[4]+LS*.5, 'G2': psl[4], 'A2': psl[4]-LS*.5, 'B2': psl[3],
    'C3': psl[3]-LS*.5, 'D3': psl[2], 'E3': psl[2]-LS*.5, 'F3': psl[2]-LS,
    'G3': psl[2]-LS*1.5, 'A3': psl[2]-LS*2, 'B3': psl[2]-LS*2.5,
    'C4': psl[2]-LS*3, 'D4': psl[2]-LS*3.5,
  };
  const pNoteY = instrument === 'Viola' ? pNoteY_alto
               : (instrument === 'Cello' || instrument === 'Bass') ? pNoteY_bass
               : pNoteY_treble;

  // Staff geometry
  const CLEF_W = 44, NOTE_PAD = 20;
  const staffW = CLEF_W + NOTE_PAD * 2 + 60; // fixed width — just two notes
  const staffLeft  = staffCX - staffW / 2;
  const staffRight = staffLeft + staffW;
  const loX = staffLeft + CLEF_W + NOTE_PAD;
  const hiX = staffRight - NOTE_PAD;
  const kx  = staffLeft + 18;

  // Staff lines
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 1;
  for (let li = 0; li < 5; li++) {
    ctx.beginPath();
    ctx.moveTo(staffLeft, psl[li]);
    ctx.lineTo(staffRight, psl[li]);
    ctx.stroke();
  }

  // Clef
  ctx.save();
  ctx.fillStyle = '#ffe066';
  ctx.textAlign = 'left';
  if (instrument === 'Viola') {
    ctx.font = `${LS * 5.2}px serif`;
    ctx.textBaseline = 'middle';
    ctx.fillText('𝄡', staffLeft + 1, psl[2] + 2);
  } else if (instrument === 'Cello' || instrument === 'Bass') {
    ctx.font = `${LS * 4.2 * 1.1576}px serif`;
    ctx.textBaseline = 'middle';
    ctx.fillText('𝄢', staffLeft + 1, psl[1] + LS * 0.1 + 7);
  } else {
    ctx.font = `${LS * 7.5}px serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('𝄞', staffLeft + 1, psl[3] + LS * 1.2);
  }
  ctx.restore();

  // Key signature
  ctx.save();
  ctx.fillStyle = '#ffe066';
  ctx.font = `bold ${LS * 1.9}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  if (keySig === 'Bb') {
    ctx.fillText('♭', kx,     psl[2] + LS * 0.75);
    ctx.fillText('♭', kx + 9, psl[0] + LS * 0.75);
  } else if (keySig === 'G') {
    if (instrument === 'Viola')                         ctx.fillText('♯', kx, psl[0] + LS * 0.9);
    else if (instrument === 'Cello' || instrument === 'Bass') ctx.fillText('♯', kx, psl[1] + LS * 0.57);
    else                                                ctx.fillText('♯', kx, psl[0] + LS * 0.4);
  } else if (keySig === 'D') {
    if (instrument === 'Viola') {
      ctx.fillText('♯', kx, psl[0]+LS*0.9); ctx.fillText('♯', kx+9, psl[2]-LS*0.1+LS*0.6);
    } else if (instrument === 'Cello' || instrument === 'Bass') {
      ctx.fillText('♯', kx, psl[1]+LS*0.57); ctx.fillText('♯', kx+10, psl[2]+LS*0.9);
    } else {
      ctx.fillText('♯', kx, psl[0]+LS*0.4); ctx.fillText('♯', kx+9, psl[2]-LS*0.6+LS*0.6);
    }
  }
  ctx.restore();

  // Draw lowest and highest notes only
  const loPitch = pitches[0];
  const hiPitch = pitches[pitches.length - 1];
  const loY = pNoteY[loPitch];
  const hiY = pNoteY[hiPitch];
  if (loY === undefined || hiY === undefined) return;

  // Ledger lines helper
  function ledger(x, y) {
    // Draw a ledger line at y if it's outside the staff
    if (y > psl[4] + LS * 0.4 || y < psl[0] - LS * 0.4) {
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - 9, y);
      ctx.lineTo(x + 9, y);
      ctx.stroke();
    }
    // Second ledger if needed
    if (y > psl[4] + LS * 1.6) {
      ctx.beginPath(); ctx.moveTo(x-9, psl[4]+LS); ctx.lineTo(x+9, psl[4]+LS); ctx.stroke();
    }
    if (y < psl[0] - LS * 1.6) {
      ctx.beginPath(); ctx.moveTo(x-9, psl[0]-LS); ctx.lineTo(x+9, psl[0]-LS); ctx.stroke();
    }
  }

  ledger(loX, loY);
  ledger(hiX, hiY);

  // Connecting line between the two noteheads
  ctx.strokeStyle = '#ffe066';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(loX + 7, loY);
  ctx.lineTo(hiX - 7, hiY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Noteheads
  [{ x: loX, y: loY }, { x: hiX, y: hiY }].forEach(({ x, y }) => {
    ctx.save();
    ctx.fillStyle = '#ffe066';
    ctx.strokeStyle = '#cc9900';
    ctx.lineWidth = 1;
    ctx.translate(x, y);
    ctx.rotate(-0.3);
    ctx.beginPath();
    ctx.ellipse(0, 0, 7, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });
}

// ─── LEVEL SELECT SCREEN ──────────────────────────────────────────────────────
function displayPitch(pitch, keySig) {
  // Format a pitch name for display given a key signature
  const maps = { D: PITCH_DISPLAY_D, G: PITCH_DISPLAY_G, Bb: PITCH_DISPLAY_Bb, C: PITCH_DISPLAY_C };
  const map = maps[keySig] || PITCH_DISPLAY_D;
  return map[pitch] || pitch.replace(/[0-9]/g, ''); // strip octave number
}

function getLevelRangeStr(levelDef) {
  if (!levelDef) return '';
  const p = levelDef.pitches;
  const keySig = levelDef.keySig || 'D';
  if (p.length === 0) return '';
  if (p.length === 1) return displayPitch(p[0], keySig);
  const first = displayPitch(p[0], keySig);
  const last  = displayPitch(p[p.length - 1], keySig);
  // Strip octave digits for display, add octave only when ambiguous
  const p0oct = p[0].replace(/[^0-9]/g, '');
  const pNOct = p[p.length - 1].replace(/[^0-9]/g, '');
  const firstFull = first + p0oct;
  const lastFull  = last  + pNOct;
  return firstFull + ' – ' + lastFull;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

// Parabolic arc between two points
function arcY(startY, endY, t, arcHeight) {
  const base = lerp(startY, endY, t);
  return base - arcHeight * Math.sin(Math.PI * t);
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
let lastTime = 0;

function update(dt) {
  if (gameState !== 'playing') return;
  if (gameOver || levelComplete) return;

  // ── Count-in: Ready / Go ──────────────────────────────────────────────────
  if (countIn) {
    const BEAT_DUR = 60 / BPM; // one quarter-note beat = ~0.714s
    const ac = getAudioCtx();
    const elapsed = ac.currentTime - countInStartTime;
    const newBeat = Math.floor(elapsed / BEAT_DUR) + 1; // beat 1, 2, 3...
    if (newBeat !== countInBeat) {
      countInBeat = newBeat;
    }
    if (elapsed >= BEAT_DUR * 2) {
      // Two beats done — unlock
      countIn = false;
    }
    return; // don't tick timer or update hero during count-in
  }

  elapsedTime += dt;

  if (hero.state === 'flip') {
    hero.flipT += dt * 1.1;  // ~0.9s total flip
    if (hero.flipT >= 1) {
      hero.flipT = 1;
      hero.state = 'idle';
      hero.x = hero.flipStartX;
      hero.y = hero.flipStartY;
      finalTime = elapsedTime;
      levelComplete = true;
      stopBackingTrack();
      showSubmitPanel();
    }
  }

  if (hero.state === 'bounce') {
    hero.bounceT += dt * 1.4; // speed of bounce
    if (hero.bounceT >= 1) {
      hero.bounceT = 1;
      hero.state = 'idle';
      hero.frame = 0;
      // Snap to position above next note
      const targetNote = hero.bounceTarget;
      hero.x = targetNote.x;
      hero.y = heroLandingY(targetNote) - HERO_H - HERO_GAP;
    }
    const t = easeInOut(hero.bounceT);
    hero.x = lerp(hero.bounceStartX, hero.bounceTarget.x, t);
    hero.y = arcY(hero.bounceStartY, heroLandingY(hero.bounceTarget) - HERO_H - HERO_GAP, hero.bounceT, 45);

    // Walk frame animation
    hero.frameTimer += dt;
    if (hero.frameTimer > 0.15) {
      hero.frame = 1 - hero.frame;
      hero.frameTimer = 0;
    }
  }

  // Shake runs independently — can overlap with bounce
  if (hero.shakeTimer > 0) {
    hero.shakeTimer -= dt;
    hero.shakeX = Math.sin(hero.shakeTimer * 60) * 5;
    if (hero.shakeTimer <= 0) {
      if (hero.state === 'shake') hero.state = 'idle';
      hero.shakeX = 0;
    }
  }

  // Camera: smoothly follow hero
  const targetCam = hero.x - W * 0.35;
  camera = lerp(camera, Math.max(0, targetCam), dt * 6);

  // Particles
  updateParticles(dt);
}


function draw(dt) { 
  // 2. Add the reset to stop the text from shifting
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  if (gameState === 'title') { drawTitleScreen(); return; }
  if (gameState === 'levelSelect') { drawLevelSelectScreen(); return; }
  if (gameState === 'levelPreview') { drawLevelPreviewScreen(); return; }

  // ── playing ──
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Staff lines (end at double bar)
  drawStaff(camera);

  // Clef (pinned to left once scrolling begins)
  const clefX = Math.max(8, 16 - camera);
  drawClef(clefX);

  // Key signature
  drawKeySignature(clefX + 64);

  // Notes
  for (const note of notes) {
    drawNote(note, camera);
  }

  // Double bar line
  drawDoubleBarLine(camera);

  // Particles and Bouncing Labels
  drawParticles(camera);
  updateAndDrawLabels(dt, camera); // Now works because dt is defined in the header

  // Hero
  {
    const hsx = hero.x - camera + hero.shakeX - HERO_W;
    let hsy = hero.y;
    const sprite = hero.state === 'bounce' && hero.frame === 1 ? SPRITE_WALK : SPRITE_IDLE;
    const spriteW = sprite[0].length * PX;
    const spriteH = sprite.length * PX;

    if (hero.state === 'flip') {
      const ft = hero.flipT;
      hsy = hero.flipStartY - Math.sin(Math.PI * ft) * 70;
      const angle = ft * Math.PI * 2;
      ctx.save();
      ctx.translate(hsx + spriteW / 2, hsy + spriteH / 2);
      ctx.rotate(angle);
      drawSprite(sprite, -spriteW / 2, -spriteH / 2, false);
      ctx.restore();
    } else {
      drawSprite(sprite, hsx, hsy, false);
    }
  }
  
  // HUD
  drawHUD();

  // Count-in overlay
  if (countIn && countInBeat >= 1) {
    const label = countInBeat === 1 ? 'READY' : 'GO!';
    const color = countInBeat === 1 ? '#ffe066' : '#44ff88';
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // Pulsing scale: starts big, shrinks as the beat ages
    const BEAT_DUR = 60 / BPM;
    const ac = getAudioCtx();
    const beatAge = (ac.currentTime - countInStartTime) % BEAT_DUR; // 0..BEAT_DUR
    const scale = 1.4 - 0.4 * (beatAge / BEAT_DUR); // 1.4 → 1.0 over the beat
    ctx.translate(W / 2, H / 2);
    ctx.scale(scale, scale);
    ctx.fillStyle = color;
    ctx.font = '36px "Press Start 2P"';
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText(label, 3, 3);
    ctx.fillStyle = color;
    ctx.fillText(label, 0, 0);
    ctx.restore();
  }

  // Game Over / Level Complete overlays
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.font = '20px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 36);
    ctx.font = '8px "Press Start 2P"';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE:  ${score}`, W / 2, H / 2 - 2);
    ctx.fillStyle = '#aaffaa';
    ctx.fillText(`TIME:   ${formatTime(finalTime)}`, W / 2, H / 2 + 18);

    // Retry + Menu buttons
    const goBtnW = 160, goBtnH = 38, goBtnGap = 24;
    const goTotalW = goBtnW * 2 + goBtnGap;
    const goBtnY = H / 2 + 40;
    const retryX = W / 2 - goTotalW / 2;
    const goMenuX = retryX + goBtnW + goBtnGap;
    drawNesButton('RETRY', retryX, goBtnY, goBtnW, goBtnH, hoveredBtn === 'RETRY', false);
    retryBtn = { x: retryX, y: goBtnY, w: goBtnW, h: goBtnH };
    drawNesButton('MENU', goMenuX, goBtnY, goBtnW, goBtnH, hoveredBtn === 'MENU_GO', false);
    goMenuBtn = { x: goMenuX, y: goBtnY, w: goBtnW, h: goBtnH };
  }

  if (levelComplete) {
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#44ff88';
    ctx.font = '18px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL CLEAR!', W / 2, H / 2 - 52);
    ctx.font = '8px "Press Start 2P"';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE:  ${score}`, W / 2, H / 2 - 18);
    ctx.fillStyle = '#aaffaa';
    ctx.fillText(`TIME:   ${formatTime(finalTime)}`, W / 2, H / 2 + 2);

    // Menu button (left) and Next Level button (right)
    const btnW = 160, btnH = 38, gap = 24;
    const totalBtnW = btnW * 2 + gap;
    const btnY = H / 2 + 28;
    const menuX = W / 2 - totalBtnW / 2;
    const nextX  = menuX + btnW + gap;

    drawNesButton('MENU',       menuX, btnY, btnW, btnH, hoveredBtn === 'MENU', false);
    menuBtn = { x: menuX, y: btnY, w: btnW, h: btnH };

    const activeLevels = getLevelSet();
    const hasNextLevel = activeLevels[currentLevel + 1] !== undefined;
    drawNesButton('NEXT LEVEL', nextX, btnY, btnW, btnH, hoveredBtn === 'NEXT', !hasNextLevel);
    nextLevelBtn = { x: nextX, y: btnY, w: btnW, h: btnH, enabled: hasNextLevel };

    if (!hasNextLevel) {
      ctx.fillStyle = '#555';
      ctx.font = '6px "Press Start 2P"';
      ctx.textAlign = 'center';
      ctx.fillText('COMING SOON', nextX + btnW / 2, btnY + btnH + 12);
    }
  }
}

function gameLoop(now) {
  // Calculate the time difference in seconds
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  update(dt);
  draw(dt); // Pass dt to draw so labels and particles can move

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// Mouse helpers
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY,
  };
}

function hitTest(pos, btn) {
  return pos.x >= btn.x && pos.x <= btn.x + btn.w &&
         pos.y >= btn.y && pos.y <= btn.y + btn.h;
}

canvas.addEventListener('mousemove', (e) => {
  const pos = getCanvasPos(e);
  hoveredBtn = null;
  if (gameState === 'title') {
    for (const btn of instrBtns) {
      if (hitTest(pos, btn)) { hoveredBtn = btn.label; break; }
    }
  } else if (gameState === 'levelSelect') {
    for (const btn of levelSelectBtns) {
      if (hitTest(pos, btn)) { hoveredBtn = `LVLSEL_${btn.level}`; break; }
    }
    if (levelSelectBackBtn && hitTest(pos, levelSelectBackBtn)) hoveredBtn = 'LVLSEL_BACK';
  } else if (gameState === 'levelPreview') {
    if (devMenuOpen) {
      for (const btn of devLevelBtns) {
        if (hitTest(pos, btn)) { hoveredBtn = `DEV_LVL_${btn.level}`; break; }
      }
    }
    if (startBtn && hitTest(pos, startBtn)) hoveredBtn = 'START';
    if (otherLevelsBtn && hitTest(pos, otherLevelsBtn)) hoveredBtn = 'OTHER_LEVELS';
  } else if (gameState === 'playing') {
    if (gameOver) {
      if (retryBtn && hitTest(pos, retryBtn)) hoveredBtn = 'RETRY';
      else if (goMenuBtn && hitTest(pos, goMenuBtn)) hoveredBtn = 'MENU_GO';
    } else if (levelComplete) {
      if (menuBtn && hitTest(pos, menuBtn)) hoveredBtn = 'MENU';
      else if (nextLevelBtn && nextLevelBtn.enabled && hitTest(pos, nextLevelBtn)) hoveredBtn = 'NEXT';
    } else {
      if (inGameMenuBtn && hitTest(pos, inGameMenuBtn)) { hoveredBtn = 'MENU_INGAME'; }
      else {
        for (const btn of noteBtns) {
          if (hitTestCircle(pos, btn)) { hoveredBtn = `NOTE_${btn.pitch}`; break; }
        }
      }
    }
  }
  canvas.style.cursor = hoveredBtn ? 'pointer' : 'default';
});

canvas.addEventListener('click', (e) => {
  const pos = getCanvasPos(e);

  if (gameState === 'title') {
    for (const btn of instrBtns) {
      if (hitTest(pos, btn)) {
        if (btn.label === 'Violin' || btn.label === 'Viola' || btn.label === 'Cello' || btn.label === 'Bass') {
          selectedInstrument = btn.label;
          currentLevel = 1;
          gameState = 'levelPreview';
          hoveredBtn = null;
        }

      }
    }
  } else if (gameState === 'levelSelect') {
    if (levelSelectBackBtn && hitTest(pos, levelSelectBackBtn)) {
      gameState = 'title';

      return;
    }
    for (const btn of levelSelectBtns) {
      if (hitTest(pos, btn)) {
        currentLevel = btn.level;
        gameState = 'levelPreview';
        hoveredBtn = null;
        return;
      }
    }
  } else if (gameState === 'levelPreview') {
    if (devMenuOpen) {
      for (const btn of devLevelBtns) {
        if (hitTest(pos, btn)) {
          currentLevel = btn.level;
          devMenuOpen = false;
          hoveredBtn = null;
          return;
        }
      }
    }
    if (startBtn && hitTest(pos, startBtn)) startPlaying();
    if (otherLevelsBtn && hitTest(pos, otherLevelsBtn)) {
      gameState = 'levelSelect';
      hoveredBtn = null;
    }
  } else if (gameState === 'playing') {
    if (gameOver) {
      if (retryBtn && hitTest(pos, retryBtn)) {
        // Retry — keep score from previous levels, replay current level
        hideSubmitPanel();
        resetGame();
        hoveredBtn = null;
        return;
      }
      if (goMenuBtn && hitTest(pos, goMenuBtn)) {
        currentLevel = 1;
        score = 0;
        hideSubmitPanel();
        gameState = 'levelSelect';
        hoveredBtn = null;
        return;
      }
    } else if (levelComplete) {
      if (menuBtn && hitTest(pos, menuBtn)) {
        currentLevel = 1;
        score = 0;
        hideSubmitPanel();
        gameState = 'levelSelect';
        hoveredBtn = null;
      } else if (nextLevelBtn && nextLevelBtn.enabled && hitTest(pos, nextLevelBtn)) {
        currentLevel++;
        hideSubmitPanel();
        gameState = 'levelPreview';
        hoveredBtn = null;
      }
    } else {
      if (inGameMenuBtn && hitTest(pos, inGameMenuBtn)) {
        currentLevel = 1;
        score = 0;
        stopBackingTrack();
        hideSubmitPanel();
        gameState = 'levelSelect';
        hoveredBtn = null;
        return;
      }
      for (const btn of noteBtns) {
        if (hitTestCircle(pos, btn)) { handlePitchInput(btn.pitch); return; }
        }
    }
  }
});

// Touch support for note buttons (prevents 300ms click delay on Chromebooks)
canvas.addEventListener('touchstart', (e) => {

  e.preventDefault();
  const touch = e.changedTouches[0];
  const pos = getCanvasPos(touch);
  for (const btn of noteBtns) {

  }
}, { passive: false });

// ─── NOTE INPUT HANDLER (keyboard + buttons share this) ───────────────────────

// Called by keyboard — matches on letter only (D accepts both D4 and D5)
function handleNoteInput(key) {
  if (gameState !== 'playing') return;
  if (gameOver || levelComplete) return;
  if (countIn) return;
  if (hero.state !== 'idle' && hero.state !== 'bounce') return;
  if (currentNoteIdx >= notes.length) return;

  const currentNote = notes[currentNoteIdx];
  const correct = key.toUpperCase() === currentNote.name;
  resolveInput(correct, currentNote);
}

// Called by on-screen buttons — matches on full pitch (D4 ≠ D5)
function handlePitchInput(pitch) {
  if (gameState !== 'playing') return;
  if (gameOver || levelComplete) return;
  if (countIn) return;
  if (hero.state !== 'idle' && hero.state !== 'bounce') return;
  if (currentNoteIdx >= notes.length) return;

  const currentNote = notes[currentNoteIdx];
  const correct = pitch === currentNote.pitch;
  resolveInput(correct, currentNote);
}

// Shared resolution logic
function resolveInput(correct, currentNote) {
  const bigHit = correct && isOnBeat();
  let labelText = "";
  let labelColor = "";

  if (correct) {
    playNoteSound(currentNote.pitch, bigHit);
    score += (bigHit ? 150 : 100);
    currentNote.answered = true;
    spawnExplosion(currentNote.x, currentNote.y, bigHit);

    labelText = bigHit ? "+150" : "+100";
    labelColor = bigHit ? "#fff" : "#ffe066";

    currentNoteIdx++;

    const nextNote = notes[currentNoteIdx];
    if (nextNote) {
      // Bounce to the next note
      hero.state = 'bounce';
      hero.bounceStartX = hero.x;
      hero.bounceStartY = hero.y;
      hero.bounceTarget = nextNote;
      hero.bounceT = 0;
      hero.frameTimer = 0;
    } else {
      // Last note answered — do the victory flip
      hero.state = 'flip';
      hero.flipStartX = hero.x;
      hero.flipStartY = hero.y;
      hero.flipT = 0;
    }
  } else {
    hearts--;
    score = Math.max(0, score - 50); // Penalty logic
    // Only switch to shake if not bouncing — if bouncing, shake runs alongside it
    if (hero.state !== 'bounce') hero.state = 'shake';
    hero.shakeTimer = 0.4;
    
    labelText = "-50";
    labelColor = "#ff4444";

    if (hearts <= 0) {
      gameOver = true;
      finalTime = elapsedTime;
      stopBackingTrack();
      showSubmitPanel();
    }
  }

  // PUSH THE LABEL (This creates the animation object)
  floatingLabels.push({
    x: currentNote.x,
    y: currentNote.y - 20,
    text: labelText,
    color: labelColor,
    vx: (Math.random() - 0.5) * 100, // Random left/right burst
    vy: -200,                        // Initial jump up
    life: 1.0                        // Lasts 1 second
  });
}


window.addEventListener('keydown', (e) => {
  // Title screen
  if (gameState === 'title') {
    if (e.key === 'Enter' && selectedInstrument) gameState = 'levelPreview';
    return;
  }

  // Level select
  if (gameState === 'levelSelect') {
    if (e.key === 'Escape') { gameState = 'title'; return; }
    return;
  }

  // Level preview
  if (gameState === 'levelPreview') {
    // Secret dev shortcut: Shift+Cmd+L (or Shift+Ctrl+L on Windows)
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'L') {
      e.preventDefault();
      devMenuOpen = !devMenuOpen;
      return;
    }
    if (e.key === 'Escape' && devMenuOpen) { devMenuOpen = false; return; }
    if (e.key === 'Enter') startPlaying();
    return;
  }

  // Playing
  if (e.key === 'Enter') {
    if (gameOver) { hideSubmitPanel(); resetGame(); return; }
    if (levelComplete) {
      const activeLevels = getLevelSet();
      if (activeLevels[currentLevel + 1]) { currentLevel++; hideSubmitPanel(); gameState = 'levelPreview'; }
      else { currentLevel = 1; score = 0; hideSubmitPanel(); gameState = 'levelSelect'; }
    }
    return;
  }

  if (gameOver || levelComplete || countIn) return;

  const key = e.key.toUpperCase();
  if (key.length !== 1 || key < 'A' || key > 'G') return;
  e.preventDefault();
  handleNoteInput(key);
});

// ─── START PLAYING ────────────────────────────────────────────────────────────
function startPlaying() {
  devMenuOpen = false;
  gameState = 'playing';
  hoveredBtn = null;
  canvas.style.cursor = 'default';
  resetGameState();
  // Start music immediately and begin count-in
  startBackingTrack();
  countInStartTime = getAudioCtx().currentTime;
  countIn = true;
  countInBeat = 0;
}

// ─── RESET ────────────────────────────────────────────────────────────────────
function resetGameState() {
  stopBackingTrack();
  notes = generateLevel();
  currentNoteIdx = 0;
  camera = 0;
  hearts = 6;
  gameOver = false;
  levelComplete = false;
  countIn = true;
  countInBeat = 0;
  countInStartTime = 0;
  elapsedTime = 0;
  finalTime = 0;
  particles = [];
  DOUBLE_BAR_X = notes[notes.length - 1].x + NOTE_SPACING * 0.7;
  hero.x = notes[0].x;
  hero.y = heroLandingY(notes[0]) - HERO_H - HERO_GAP;
  hero.state = 'idle';
  hero.shakeX = 0;
  hero.frame = 0;
  hero.bounceT = 0;
  hero.flipT = 0;
}

function resetGame() {
  // After level complete/game over, go back to level preview
  gameState = 'levelPreview';
}

// Focus canvas on load
window.addEventListener('load', () => {
  canvas.focus();

  // Generate favicon from violin sprite
  const fav = document.createElement('canvas');
  fav.width = 32; fav.height = 32;
  const fctx = fav.getContext('2d');

  // Dark background
  fctx.fillStyle = '#0a0a1a';
  fctx.fillRect(0, 0, 32, 32);

  // Draw SPRITE_VIOLIN at 1px per cell, centred
  const FIC = {
    W: '#d4860a', D: '#8b4a00', L: '#f5c84a', N: '#c07020',
    G: '#cccccc', S: '#3a1a00', I: '#e8a030', C: '#222',
    B: '#f5f5dc', R: '#8b6914',
  };
  const cols = SPRITE_VIOLIN[0].length;
  const rows = SPRITE_VIOLIN.length;
  const px = 1;
  const offX = Math.floor((32 - cols * px) / 2);
  const offY = Math.floor((32 - rows * px) / 2);
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const ch = SPRITE_VIOLIN[row][col];
      if (ch === '_') continue;
      fctx.fillStyle = FIC[ch] || '#fff';
      fctx.fillRect(offX + col * px, offY + row * px, px, px);
    }
  }

  const link = document.createElement('link');
  link.rel = 'icon';
  link.href = fav.toDataURL('image/png');
  document.head.appendChild(link);
});
</script>
